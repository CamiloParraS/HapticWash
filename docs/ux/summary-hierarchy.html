<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HapticWash · Summary hierarchy</title>
<style>
:root{--p:#d9c9ff;--track:#3a3646;--var:#c9c4d4;--tx:#efeaf7;--mut:#a29cb3;--chip:#2f2b3a;--tint:rgba(217,201,255,.12)}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-sans,system-ui,sans-serif);padding:8px 0 16px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
figure{width:227px}
figcaption{font-size:12.5px;line-height:1.4;margin-top:10px;color:var(--muted-foreground,#999);text-wrap:pretty}
figcaption b{display:block;color:var(--foreground,#eee);font-size:13.5px;margin-bottom:2px}
.w{width:227px;height:227px;border-radius:50%;position:relative;overflow:hidden;color:var(--tx);
 background:radial-gradient(90% 70% at 30% 12%,#1e1a29,#000 70%);box-shadow:0 0 0 3px #2a2830,0 0 0 6px #0b0a0e}
.w>*{position:absolute}
.clock{top:7px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;background:#000;padding:2px 12px;border-radius:99px;color:var(--var)}
svg{left:0;top:0}
.num{text-align:center;left:0;right:0}
.big{font-size:44px;font-weight:600;line-height:1}
.sm{font-size:11px;color:var(--var)}
.cap{font-size:10px;color:var(--var);text-align:center;left:0;right:0}
.card{left:14px;right:14px;bottom:-14px;background:var(--tint);border-radius:16px 16px 0 0;padding:8px 16px 18px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.25}
.card i{display:block;font-style:normal;font-weight:400;font-size:10px;color:var(--var);margin-top:2px}
.r{display:flex;gap:7px;align-items:center;left:36px;right:36px;border-radius:14px;padding:4px 8px;background:var(--tint)}
.r .ic{width:26px;height:26px;border-radius:50%;background:#2a2733;flex:none;display:grid;place-items:center;font-size:11px;color:var(--var)}
.r b{display:block;font-size:12px;line-height:1.15}
.r span{display:block;font-size:9.5px;color:var(--var);line-height:1.25}
.r span.f{color:var(--p)}
.r.q{background:none}
.r.q b{font-weight:400;color:var(--var);font-size:10.5px}
.x{color:#f19aa8}
</style></head><body>
<div class="row">

<figure>
<div class="w">
 <div class="clock">3:44</div>
 <svg width="227" height="227" viewBox="0 0 227 227"><g fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-62 113.5 113.5)">
  <circle cx="113.5" cy="113.5" r="76" stroke="var(--p)" style="stroke-dasharray:70 25.4 70 25.4 70 25.4 70 407"/>
  <circle cx="113.5" cy="113.5" r="76" stroke="var(--track)" style="stroke-dasharray:70 407;stroke-dashoffset:-381.6"/>
 </g></svg>
 <div class="num" style="top:68px"><div class="big">4</div><div class="sm" style="margin-top:4px">of 5 look covered</div></div>
 <div class="cap" style="top:156px;color:#fff">Washed for 1:25</div>
 <div class="card" style="top:182px;bottom:auto;height:70px">Focus next time:<br>Fingertips ›</div>
</div>
<figcaption><b>Before</b>The ring shows a gap; the biggest object says Fingertips, the missed row says Between fingers. The card runs into the bezel.</figcaption>
</figure>

<figure>
<div class="w">
 <div class="clock">3:44</div>
 <svg width="227" height="227" viewBox="0 0 227 227"><g fill="none" stroke-width="8" stroke-linecap="round" transform="translate(113.5 100) scale(.78) translate(-113.5 -113.5) rotate(-62 113.5 113.5)">
  <circle cx="113.5" cy="113.5" r="76" stroke="var(--p)" style="stroke-dasharray:70 25.4 70 25.4 70 25.4 70 407"/>
  <circle cx="113.5" cy="113.5" r="76" stroke="var(--track)" style="stroke-dasharray:70 407;stroke-dashoffset:-381.6"/>
 </g></svg>
 <div class="num" style="top:48px"><div class="big" style="font-size:34px">4<span class="sm" style="font-size:13px"> of 5</span></div><div class="sm" style="margin-top:3px;color:#fff;font-weight:600">Between fingers brief</div></div>
 <div class="cap" style="top:121px">Washed for 1:25</div>
 <div class="r" style="top:146px"><div class="ic">✋</div><div><b>Between fingers</b><span>◐ May have been brief</span><span class="f">Missed in 3 of last 5</span></div></div>
 <div class="r q" style="top:196px;justify-content:center"><b>✓ 4 covered ›</b></div>
</div>
<figcaption><b>After · first view</b>The ring names its own gap. One row, with the history count as its second line, replaces the card.</figcaption>
</figure>

<figure>
<div class="w">
 <div class="cap" style="top:20px">Washed for 1:25</div>
 <div class="r q" style="top:52px;background:none;padding:4px 8px"><div class="ic" style="background:rgba(217,201,255,.18);color:var(--p)">✓</div><b style="font-size:12px;color:var(--tx);font-weight:600">Palms</b></div>
 <div class="r q" style="top:86px"><div class="ic" style="background:rgba(217,201,255,.18);color:var(--p)">✓</div><b style="font-size:12px;color:var(--tx);font-weight:600">Back of hands</b></div>
 <div class="r q" style="top:120px"><div class="ic" style="background:rgba(217,201,255,.18);color:var(--p)">✓</div><b style="font-size:12px;color:var(--tx);font-weight:600">Thumbs</b></div>
 <div class="r q" style="top:154px"><div class="ic" style="background:rgba(217,201,255,.18);color:var(--p)">✓</div><b style="font-size:12px;color:var(--tx);font-weight:600">Fingertips</b></div>
</div>
<figcaption><b>After · "4 covered" opened</b>Covered steps use the same row shape as the flagged one, quieter. Every guide stays one tap away.</figcaption>
</figure>

</div></body></html>
